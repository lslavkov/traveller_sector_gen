[project]
name = "traveller-sector-gen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.15.17",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
